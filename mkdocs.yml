site_name: POPS
site_description: Misspecification-aware uncertainty quantification for regression
site_url: https://pops-uq.github.io/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [vendor/popsregression]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true


markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - tables

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lab.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Interactive tutorial: tutorials/index.md
  - How POPS works: overview.md
  - Algorithm: 
      - POPS Hypercube: method/hypercube.md
      - POPS PAC-Ellipse: method/pac-ellipse.md
  - Implementations:
      - implementations/index.md
      - Python:
          - implementations/python/index.md
          - Hypercube and ensemble regression: implementations/python/usage.md
          - Ellipsoid posteriors: implementations/python/ellipse.md
          - PAC-Ellipse worked example: implementations/python/pac-ellipse.md
          - Polynomial regression example: implementations/python/example.md
          - Studies: implementations/python/studies.md
          - API reference: implementations/python/api.md
          - Glossary: implementations/python/glossary.md
      - Julia: implementations/julia.md
  - Papers and citation: citation.md
  - Contributors: contributors.md
  - Contributing: contributing.md
  - Glossary: glossary.md

strict: true
