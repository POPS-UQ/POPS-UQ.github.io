site_name: POPS
site_description: Misspecification-aware uncertainty quantification for regression
site_url: https://pops-uq.github.io/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The header bar is hidden on desktop (see stylesheets/extra.css), so the
# built-in search box would be unreachable there. Disable search entirely.
plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - tables

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - How POPS works: overview.md
  - Algorithm: 
      - POPS Hypercube: method/hypercube.md
      - POPS PAC-Ellipse: method/pac-ellipse.md
  - Implementations:
      - Python: getting-started/python.md
      - Julia: getting-started/julia.md
  - Citation: citation.md
  - Contributing: contributing.md
  - Glossary: glossary.md

strict: true
